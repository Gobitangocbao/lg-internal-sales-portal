<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../templates/lg-tokens.css">
<style>:root{--canvas-w:1080px;--canvas-h:1350px}
/* A logo placed as a CSS background whose path is wrong. The box keeps its size, so the
   layout looks correct and nothing renders inside it. */
.mark{position:absolute;left:var(--margin);top:var(--margin);
  height:var(--logo-h);width:calc(var(--logo-h) * 1.846);
  background:url("../../assets/logos/LGE_Logo_HeritageRed_Grey_RGB.png") no-repeat center/contain}
</style></head><body>
<div class="lg-canvas" style="background:var(--lg-warm-gray-07)"><div class="lg-layer">
<div class="mark"></div>
<img class="lg-slogan lg-slogan--bottom-right" src="../../assets/slogan/LGE_Electronics_Slogan_Horizontal_Mono_ActiveRed_RGB.png" alt="Life's Good">
</div></div></body></html>
