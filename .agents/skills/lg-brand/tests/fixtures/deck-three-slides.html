<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../templates/lg-tokens.css">
<style>:root{--canvas-w:1920px;--canvas-h:1080px}
body{margin:0} .lg-canvas{margin-bottom:20px}
</style></head><body>
<!-- Three canvases in one file. Slides 1 and 2 are correct; slide 3 puts the logo bottom-right,
     which is not one of the five permitted positions. Measuring only the first canvas - the old
     behaviour - reports this deck clean. -->
<div class="lg-canvas" style="background:var(--lg-warm-gray-07)"><div class="lg-layer">
<img class="lg-logo lg-logo--upper-left" src="../../assets/logo/LGE_Logo_HeritageRed_Grey_RGB.png" alt="LG">
</div></div>
<div class="lg-canvas" style="background:var(--lg-warm-gray-07)"><div class="lg-layer">
<img class="lg-logo lg-logo--upper-left" src="../../assets/logo/LGE_Logo_HeritageRed_Grey_RGB.png" alt="LG">
</div></div>
<div class="lg-canvas" style="background:var(--lg-warm-gray-07)"><div class="lg-layer">
<img class="lg-logo" style="position:absolute;right:var(--margin);bottom:var(--margin)"
     src="../../assets/logo/LGE_Logo_HeritageRed_Grey_RGB.png" alt="LG">
</div></div>
</body></html>
