<!doctype html><html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../templates/lg-tokens.css">
<style>:root{--canvas-w:1920px;--canvas-h:1080px}
/* The component is authored at 560px and enlarged for a 1920px slide. transform:scale()
   leaves the layout box at 560px, so `right:var(--margin)` puts the UNSCALED edge on the
   margin and the painted edge runs off the slide. */
.block{position:absolute;top:400px;right:var(--margin);width:560px;height:200px;
  background:var(--lg-warm-gray-05);transform:scale(1.8);transform-origin:top left;
  font-family:"LG EI Text";font-size:16px;color:var(--lg-warm-gray-02);padding:20px}
</style></head><body>
<div class="lg-canvas" style="background:var(--lg-warm-gray-07)"><div class="lg-layer">
<img class="lg-logo lg-logo--upper-left" src="../../assets/logo/LGE_Logo_HeritageRed_Grey_RGB.png" alt="LG">
<div class="block">Khối phóng to bằng transform.</div>
</div></div></body></html>
