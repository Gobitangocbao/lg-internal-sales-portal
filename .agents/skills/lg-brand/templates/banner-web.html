<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LG web hero banner 1920x720</title>
<link rel="stylesheet" href="lg-tokens.css">
<style>
  /* LG.com hero (ST0001), Wide: 1920 x 720. Web system, so:
       - Active Red is #EA1917, not #FD312E
       - type follows the LG.com scale, not the BI grid
       - text width is fixed at 862px (Wide) or 642px (Narrow)
     See references/web-system.md. */
  :root{
    --canvas-w:1920px; --canvas-h:720px;
    --red:var(--lg-active-red-web);
    --text-w:862px;          /* Wide. Narrow is 642px. */
  }

  html,body{background:#555;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .hero{background:var(--lg-warm-gray-06)}

  /* Web margins are the LG.com grid's, not the BI 5% rule:
     XL (1920+) margin 240px, gutter 24px, 24 columns. */
  .copy{
    position:absolute; left:240px; top:50%; transform:translateY(-50%);
    width:var(--text-w); z-index:2;
  }

  .eyebrow{
    font-family:"LG EI Text"; font-weight:400; font-size:16px; line-height:18px;
    color:var(--lg-warm-gray-02); margin-bottom:12px;
  }
  h1{
    /* Title Medium, desktop: EI Headline Semibold 56 / 60 */
    font-size:56px; line-height:60px; font-weight:600;
    color:var(--lg-black); margin-bottom:16px;
  }
  .body{
    font-family:"LG EI Text"; font-weight:400; font-size:16px; line-height:24px;
    color:var(--lg-warm-gray-02); margin-bottom:32px;
  }

  /* Box Button, Medium (default): height 44px, min width 100px, text 16/16.
     Primary = Active Red; Secondary = outlined black. Max two CTAs. */
  .cta{display:flex;gap:16px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    height:44px;min-width:100px;padding:0 24px;border-radius:4px;
    font-family:"LG EI Text";font-weight:600;font-size:16px;line-height:16px;
    text-decoration:none;
  }
  .btn--primary{background:var(--red);color:var(--lg-white);border:1px solid var(--red)}
  .btn--secondary{background:transparent;color:var(--lg-black);border:1px solid var(--lg-black)}

  .visual{
    position:absolute; right:0; top:0; width:960px; height:100%;
    object-fit:cover; z-index:1;
  }
</style>
</head>
<body>

<div class="lg-canvas hero">

  <!-- Product or lifestyle image on the right. Keep the content in the centre 80%
       of the source image - that is the safe area across breakpoints.
  <img class="visual" src="product.jpg" alt="">
  -->

  <div class="copy">
    <p class="eyebrow">Eyebrow, up to 50 characters</p>
    <h1>Headline up to sixty characters</h1>
    <p class="body">Body copy, up to 200 characters. Sentence case: capitalise the first letter
      only.</p>
    <div class="cta">
      <a class="btn btn--primary" href="#">Buy now</a>
      <a class="btn btn--secondary" href="#">Learn more</a>
    </div>
  </div>
</div>

</body>
</html>

<!--
CHECK
    python3 ../scripts/brand_check.py banner-web.html --web

SIZES (source: GP1 Banner ST0001)
    Desktop / tablet   Wide 1920x720  |  Content 1440x720  |  Narrow 1600x720 (NOT recommended)
    Mobile             upload 720x960, displays at 360x480
    Text width         Wide 862px | Narrow 642px
    Headline           desktop 56px default (80px option) | mobile 36px
    Body               16px both
    Formats            JPG, PNG, GIF, MP4;  max 5120 KB

WHY THERE IS NO LOGO ON THIS TEMPLATE
    A hero banner sits inside lge.com, which already carries the LG logo in its header. Adding
    another one duplicates it. If this banner is for a context with no site chrome - a paid
    placement, a partner site, a social crop - add the logo upper-left and switch back to the
    BI grid and BI Active Red (#FD312E), because it is no longer an LG.com component.

ACCESSIBILITY
    WCAG 2.2 AA, 4.5:1 minimum. Never bake the headline into the image - the web guide treats
    text inside images as an accessibility violation. Every image needs alt text.

DARK VARIANT
    Set .hero background to var(--lg-warm-gray-01) or #000, h1 and .btn--secondary colour to
    var(--lg-white), .body to var(--lg-warm-gray-04), and give .btn--secondary a white border.
-->
