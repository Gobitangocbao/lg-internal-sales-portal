<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LG poster A2</title>
<link rel="stylesheet" href="lg-tokens.css">
<style>
  /* A2 = 420 x 594 mm. At 300 dpi that is 4961 x 7016 px.
     Working in mm keeps the print maths honest: margin 21mm, gutter 10.5mm,
     symbol h 27.3mm / file h 40.9mm, slogan sign-off height 18.9mm. */
  :root{ --canvas-w:420mm; --canvas-h:594mm; }

  @page{ size:420mm 594mm; margin:0 }
  html,body{background:#555}
  @media print{ html,body{background:none} }

  .poster{background:var(--lg-black)}

  .content{
    position:absolute;
    left:var(--margin); right:var(--margin);
    top:calc(var(--margin) + 2 * (var(--row) + var(--gutter)));
    color:var(--lg-white);
  }

  h1{
    font-size:112pt; line-height:1.0; font-weight:600;
    color:var(--lg-white); margin-bottom:12mm;
    max-width:calc(7 * var(--col) + 6 * var(--gutter));
  }
  .sub{
    font-family:"LG EI Text"; font-weight:400; font-size:24pt; line-height:1.45;
    color:var(--lg-warm-gray-05);
    max-width:calc(5 * var(--col) + 4 * var(--gutter));
  }

  .detail{
    position:absolute; left:var(--margin);
    bottom:calc(var(--margin) + var(--slogan-h) + var(--gutter) * 2);
    font-family:"LG EI Text"; font-weight:400; font-size:14pt; line-height:1.6;
    color:var(--lg-warm-gray-05);
  }
  .detail strong{font-family:"LG EI Text";font-weight:600;color:var(--lg-white)}
</style>
</head>
<body>

<div class="lg-canvas poster">

  <!-- Gradient master, cropped. Keep at least two colours visible in the crop or it stops
       reading as a gradient. Rotation is allowed; recolouring is not.
       Gradient 04 is the dark, "Innovative" master (measured luminance 1-52), which is what
       makes the white logotype and white headline read cleanly. Gradients 01-03 are light
       to mid (01 is very light, 184-254) - on those, use dark type and the HeritageRed+Grey
       logo instead, and never put the red symbol over a red or pink area. -->
  <img class="lg-gradient"
       src="../assets/gradients/LGE_Electronics_Gradient_04_RGB.jpg"
       style="object-position:40% 35%"
       alt="">

  <div class="lg-layer">
    <!-- Dark ground, so: red symbol + white logotype - the variant BI p.21 approves for
         black and image backgrounds. There is no all-white mono for this compact lockup;
         it exists only for the longer 2D+LG-Electronics one, which at 1.3 x margin would
         put the symbol under the 4mm minimum on A2. See references/logo-and-slogan.md. -->
    <img class="lg-logo lg-logo--upper-left"
         src="../assets/logo/LGE_Logo_HeritageRed_White_RGB.png"
         alt="LG">

    <div class="content">
      <h1>A short, confident headline</h1>
      <p class="sub">One supporting sentence. Print rewards restraint far more than screens do.</p>
    </div>

    <div class="detail">
      <strong>Event name</strong><br>
      Date &middot; Venue &middot; City
    </div>

    <img class="lg-slogan lg-slogan--bottom-right"
         src="../assets/slogan/LGE_Electronics_Slogan_Horizontal_Mono_White_RGB.png"
         alt="Life's Good">
  </div>
</div>

</body>
</html>

  - Bleed: add 3mm and extend the gradient into it. This template is trim size only.
  - The gradient masters are 2000 x 2000 px. At A2 that is roughly 120 dpi when stretched full
