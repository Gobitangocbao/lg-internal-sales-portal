<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LG slide 16:9</title>
<link rel="stylesheet" href="lg-tokens.css">
<style>
  /* 1920 x 1080 -> margin 54px, gutter 27px, symbol h 70.2px / file h 105.1px */
  :root{ --canvas-w:1920px; --canvas-h:1080px; }

  html,body{background:#555;display:flex;align-items:center;justify-content:center;min-height:100vh}

  .slide{background:var(--lg-warm-gray-07)}

  .content{
    position:absolute;
    left:var(--margin);
    right:var(--margin);
    top:calc(var(--margin) + var(--row) + var(--gutter));
    bottom:calc(var(--margin) + var(--row) + var(--gutter));
    display:flex;flex-direction:column;justify-content:center;
    /* six of nine columns - leaves air, which is the point of the grid */
    max-width:calc(6 * var(--col) + 5 * var(--gutter));
  }

  .eyebrow{
    font-family:"LG EI Text";font-weight:600;font-size:24px;line-height:1.2;
    letter-spacing:.08em;text-transform:uppercase;
    color:var(--lg-active-red);margin-bottom:24px;
  }
  h1{font-size:92px;line-height:1.02;color:var(--lg-warm-gray-01);margin-bottom:28px}
  .sub{
    font-family:"LG EI Text";font-weight:400;font-size:32px;line-height:1.45;
    color:var(--lg-warm-gray-02);max-width:calc(5 * var(--col) + 4 * var(--gutter));
  }

  .rule{width:calc(var(--col));height:6px;background:var(--lg-active-red);margin-bottom:32px}

  /* Sign-off slogan bottom-right, logo upper-left: kept far apart on purpose. */
</style>
</head>
<body>

<div class="lg-canvas slide">

  <!-- Optional gradient background. One master only; crop via object-fit/object-position,
       never rebuild it in CSS. Delete this line for a flat warm-grey slide.
  <img class="lg-gradient" src="../assets/gradients/LGE_Electronics_Gradient_01_RGB.jpg" alt="">
  -->

  <div class="lg-layer">
    <img class="lg-logo lg-logo--upper-left"
         src="../assets/logo/LGE_Logo_HeritageRed_Grey_RGB.png"
         alt="LG">

    <div class="content">
      <div class="rule"></div>
      <p class="eyebrow">Channel Development</p>
      <h1>Headline goes here, kept short and specific</h1>
      <p class="sub">Supporting line in LG EI Text Regular. Say one thing per slide and let the
        margin do the rest of the work.</p>
    </div>

    <img class="lg-slogan lg-slogan--bottom-right"
         src="../assets/slogan/LGE_Electronics_Slogan_Horizontal_Mono_ActiveRed_RGB.png"
         alt="Life's Good">
  </div>

  <!-- Uncomment while composing, remove before export:
  <div class="lg-grid-overlay"></div>
  -->
</div>

</body>
</html>

<!--
EXPORT
  Render at exactly 1920x1080 with a headless browser, e.g.

    python3 -c "
    from playwright.sync_api import sync_playwright
    with sync_playwright() as p:
        b=p.chromium.launch(); pg=b.new_page(viewport={'width':1920,'height':1080})
        pg.goto('file:///abs/path/slide-16x9.html'); pg.wait_for_timeout(1200)
        pg.locator('.lg-canvas').screenshot(path='slide.png'); b.close()"

  The 1.2s wait matters - it lets the OTFs finish loading. Screenshot too early and the
  export captures the fallback font even though font-display:block is set.

CHECK
    python3 ../scripts/brand_check.py slide-16x9.html --canvas 1920x1080

NOTES
  - On a dark or gradient background, swap to LGE_Logo_HeritageRed_White_RGB.png or the
    Mono_White variant, and the white slogan.
  - The slogan is optional. If used, it is a sign-off OR a lead message, never both, and
    never adjacent to the logo. Most interior slides need neither slogan nor a rule.
  - Do not put a page number or footer inside the margin.
-->
