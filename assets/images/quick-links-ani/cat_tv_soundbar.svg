<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .screen-scan {
      transform-origin: center;
      animation: tvScan 3.2s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .sound-pulse {
      animation: soundPulse 3.2s ease-in-out infinite;
    }
    @keyframes tvScan {
      0%, 20% { opacity: 0; transform: scaleX(0.2); }
      35% { opacity: 0.8; transform: scaleX(1); }
      60%, 100% { opacity: 0; transform: scaleX(1); }
    }
    @keyframes soundPulse {
      0%, 25% { transform: scale(1); opacity: 0.4; }
      40% { transform: scale(1.1); opacity: 1; fill: #EA1917; }
      55%, 100% { transform: scale(1); opacity: 0.4; }
    }
  </style>
  <rect x="10" y="14" width="44" height="28" rx="4" stroke="#262626" stroke-width="2.2" fill="#FFFFFF"/>
  <rect class="screen-scan" x="13" y="17" width="38" height="22" rx="2" fill="url(#tvGlow)" opacity="0.3"/>
  <rect x="14" y="47" width="36" height="5" rx="2.5" stroke="#262626" stroke-width="2" fill="#FFFFFF"/>
  <path d="M32 42V47" stroke="#262626" stroke-width="2.2" stroke-linecap="round"/>
  <circle class="sound-pulse" cx="19" cy="49.5" r="1.2" fill="#262626"/>
  <circle class="sound-pulse" cx="45" cy="49.5" r="1.2" fill="#262626"/>
  <defs>
    <linearGradient id="tvGlow" x1="13" y1="28" x2="51" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EA1917" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FD312E" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
</svg>
