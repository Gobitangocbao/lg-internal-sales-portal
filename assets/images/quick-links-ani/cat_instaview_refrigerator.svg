<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .glass-panel {
      transition: fill 0.3s ease;
      animation: instaviewKnock 4.8s ease-in-out infinite;
    }
    .knock-waves {
      animation: knockRipples 4.8s ease-out infinite;
    }
    @keyframes instaviewKnock {
      0%, 20% { fill: #262626; fill-opacity: 0.9; }
      25%, 28% { fill: #262626; }
      30%, 33% { fill: #333333; }
      38%, 65% { fill: #FFF2D6; fill-opacity: 0.85; }
      75%, 100% { fill: #262626; fill-opacity: 0.9; }
    }
    @keyframes knockRipples {
      0%, 22% { opacity: 0; transform: scale(0.5); }
      25% { opacity: 0.8; transform: scale(1); }
      32% { opacity: 0.9; transform: scale(1.2); }
      40%, 100% { opacity: 0; }
    }
  </style>
  <rect x="14" y="10" width="36" height="44" rx="4" stroke="#262626" stroke-width="2.2" fill="#FFFFFF"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#262626" stroke-width="2"/>
  <line x1="14" y1="34" x2="50" y2="34" stroke="#262626" stroke-width="2"/>
  <rect class="glass-panel" x="35" y="14" width="12" height="16" rx="2" stroke="#262626" stroke-width="1.8" fill="#262626"/>
  <line x1="30" y1="22" x2="30" y2="28" stroke="#EA1917" stroke-width="2.2" stroke-linecap="round"/>
  <circle class="knock-waves" cx="41" cy="22" r="6" stroke="#EA1917" stroke-width="1.5" fill="none" opacity="0"/>
</svg>
